<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Week 9 AI 유동장 예측 데모</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; text-align: center; background-color: #f8f9fa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
        .control-panel { margin: 25px 0; background: #eef2f5; padding: 15px; border-radius: 8px; }
        .canvas-container { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .canvas-box { background: #fff; border: 1px solid #dee2e6; padding: 15px; border-radius: 8px; }
        canvas { border: 1px solid #333; margin-top: 10px; }
        input[type=range] { width: 250px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>AI 유동장 예측 외삽(Extrapolation) 평가 데모</h2>
        <!-- ★ 본인 성명과 학번으로 변경하세요 ★ -->
        <p><strong>작성자:</strong> [박한민] | <strong>학번:</strong> [2021098704]</p>

        <div class="control-panel">
            <label for="reSlider"><strong>Reynolds Number (Re): </strong></label>
            <input type="range" id="reSlider" min="300" max="1000" step="50" value="500" oninput="onReChange(this.value)">
            <span id="reValDisplay" style="font-weight: bold; color: #007bff;">500</span>
            <br>
            <small style="color: #6c757d;">* Re &gt; 300 영역은 AI 모델이 학습하지 않은 외삽(Extrapolation) 구간입니다.</small>
        </div>

        <div class="canvas-container">
            <div class="canvas-box">
                <h4>AI 예측 유동장 (Surrogate)</h4>
                <canvas id="aiCanvas" width="250" height="250"></canvas>
            </div>
            <div class="canvas-box">
                <h4>CFD 수치해석 정답 (Ground Truth)</h4>
                <canvas id="cfdCanvas" width="250" height="250"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
